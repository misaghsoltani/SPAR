# W&B Sweep configuration for hyperparameter optimization

# Sweep settings
type: "heuristic" # Options: "heuristic", "world_model"
method: "bayes" # Options: "bayes", "grid", "random"
metric_name: "val_loss"
metric_goal: "minimize"
count: 10 # Number of runs the agent should perform
create_agent_script: true # Whether to create a Python script to run the agent

