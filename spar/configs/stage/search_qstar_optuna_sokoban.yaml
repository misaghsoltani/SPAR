# @package _global_
# Configuration for Q* Search stage

defaults:
  - /schema/search_qstar_schema@_here_
  - /model: ${env}
  - /search: default
  - /wandb: default

stage: search_qstar

search:
  max_search_itrs: 15400
  vis_recon_mode: gif
  vis_env_mode: gif
  vis_combined_mode: gif
  vis_combined_include_start_goal: true
  vis_env_row_title: Environment Rendered
  vis_recon_row_title: Reconstruction
  vis_start_title: Start
  vis_goal_title: Goal

  ## Visualization sizing
  # Individual visuals (env-only / recon-only): "original" or "custom"
  vis_individual_size_mode: original
  vis_individual_height: null
  vis_individual_width: null
  vis_combined_row_height: null
  vis_combined_row_width: null
  ## Behavior when search is unsolved
  validate_on_unsolved: false
  vis_on_unsolved: true
  log_moves_on_unsolved: false
  save_vis_fps: 3

  # Q* Search parameters
  qstar_batch_size: 100
  qstar_weight: 0.8
  qstar_show_running_summary: true

  # Model paths for Q* search
  heuristic_model_path: spar/search_test/dqn_state_sokoban_new.pt
  env_model_path: spar/saved_models/world_models/${env.name}_world_model_disc/world_model_checkpoint_transition_model.pt
  alignment_model_path: spar/saved_models/alignment_models/sokoban_alignment_model_disc_optuna_best_2/alignment_model_checkpoint_alignment_model.pt
  # Base encoder to use when encoder_mode requires it
  encoder_model_path: spar/saved_models/alignment_models/sokoban_alignment_model_disc_optuna_best/alignment_model_checkpoint_pretrained_encoder.pt
  # Path to decoder checkpoint for visualization reconstructions (required for image/gif)
  decoder_model_path: spar/saved_models/world_models/${env.name}_world_model_disc/world_model_checkpoint_decoder.pt

  # TF32 preferences for CUDA. Defaults leave PyTorch settings unchanged.
  # Set allow_tf32 true or float32_matmul_precision to 'highest'|'high'|'medium' to opt in.
  allow_tf32: false
  float32_matmul_precision: null # null keeps PyTorch's default (highest)

  # Input/output paths for Q* search
  # Single image pair mode
  state_path: null # "outputs/image_processing_cube3/resized_input_matplotlib.png"
  goal_state_path: null # "spar/search_test/goal.png"
  # Folder mode (runs search on all images in folder)
  # Provide only `state_dir` to use a fixed goal image above for all states,
  # or provide both `state_dir` and `goal_state_dir` to pair by sorted order.
  state_dir: null
  goal_state_dir: null
  images_glob: "*.png"
  # Use HDF5 pairs dataset (overrides single/folder modes when set)
  pairs_file: spar/offline_data/search_pairs/deepcubeai_sokoban_search_test.h5 # spar/offline_data/search_pairs/cube3_default_pairs_100pairs.h5
  # Back-compat single selection (equivalent to include=[...])
  pairs_start_variant: null # e.g., "base" or variation name
  pairs_goal_variant: base # e.g., "base" or variation name
  # Independent include/exclude lists for start/goal side variations
  # Use 'base' to refer to the base images stored under pairs/<side>/images
  pairs_start_include: null # e.g., ["base", "sim2real10"] or null for all
  pairs_start_exclude: null # e.g., ["artifact_edges"]
  pairs_goal_include: null # e.g., ["base"]
  pairs_goal_exclude: null
  results_dir: ${hydra:runtime.output_dir}/search_qstar_optuna/${env.name}_results

  # Neural network batch size
  nnet_batch_size: null
  per_eq_tol: 100
  encoder_mode: align_only

  start_idx: 0
  verbose: false

wandb:
  mode: disabled

model:
  chan_in: 3
  chan_out: 3
  enc_dim: 1600
  enc_h: 10
  enc_w: 10
  chan_enc: 16
  discrete:
    encoder:
      architecture:
        - _target_: spar.utils.pytorch_utils.pytorch_models.Conv2dModel
          chan_in: 3
          channel_sizes:
            - 16
            - 16
          kernel_sizes:
            - 2
            - 2
          paddings:
            - 0
            - 0
          layer_batch_norms:
            - true
            - false
          layer_acts:
            - RELU
            - SIGMOID
          strides:
            - 2
            - 2
        - _target_: torch.nn.Flatten
        - _target_: spar.utils.pytorch_utils.pytorch_models.STEThresh
          threshold: 0.5
      chan_in: null
      resnet_chan: null
      num_resnet_blocks: null
      fc_in: null
      fc_h_dim: null
    env_model:
      architecture:
        - _target_: spar.utils.pytorch_utils.pytorch_models.Conv2dModel
          chan_in: 20
          channel_sizes:
            - 32
            - 32
            - 16
          kernel_sizes:
            - 3
            - 3
            - 3
          paddings:
            - 1
            - 1
            - 1
          layer_batch_norms:
            - true
            - true
            - false
          layer_acts:
            - RELU
            - RELU
            - SIGMOID
          strides:
            - 1
            - 1
            - 1
        - _target_: torch.nn.Flatten
    decoder:
      architecture:
        - _target_: spar.utils.pytorch_utils.pytorch_models.Conv2dModel
          transpose: true
          chan_in: 16
          channel_sizes:
            - 16
            - 16
          kernel_sizes:
            - 2
            - 2
          paddings:
            - 0
            - 0
          layer_batch_norms:
            - true
            - false
          layer_acts:
            - RELU
            - SIGMOID
          strides:
            - 2
            - 2
        - _target_: spar.utils.pytorch_utils.pytorch_models.Conv2dModel
          chan_in: 16
          channel_sizes:
            - 3
          kernel_sizes:
            - 1
          paddings:
            - 0
          layer_batch_norms:
            - false
          layer_acts:
            - LINEAR
          strides:
            - 1
    alignment_model:
      architecture:
        - _target_: spar.utils.pytorch_utils.pytorch_models.Conv2dModel
          chan_in: 3
          channel_sizes:
            - 64
            - 64
          kernel_sizes:
            - 2
            - 2
          paddings:
            - 0
            - 0
          layer_batch_norms:
            - true
            - true
          layer_acts:
            - RELU
            - RELU
          strides:
            - 2
            - 2
          group_norms:
            - 0
            - 0
          use_bias_with_norm: true
        - _target_: spar.utils.pytorch_utils.pytorch_models.ResnetConv2dModel
          in_channels: 64
          resnet_channels: 64
          out_channels: 64
          kernel_size: 3
          padding: 1
          num_resnet_blocks: 8
          batch_norm: true
          act: RELU
          group_norm: 0
          use_bias_with_norm: true
        - _target_: spar.utils.pytorch_utils.pytorch_models.Conv2dModel
          chan_in: 64
          channel_sizes:
            - 16
          kernel_sizes:
            - 1
          paddings:
            - 0
          strides:
            - 1
          layer_batch_norms:
            - false
          layer_acts:
            - SIGMOID
        - _target_: torch.nn.Flatten
      chan_in: 3
      resnet_chan: 64
      num_resnet_blocks: 8
      fc_in: null
      fc_h_dim: null
  continuous: null

hydra:
  job:
    name: ${env.name}_${stage}_optuna
    chdir: false
  run:
    dir: "${save_dir}/${env.name}/${stage}_optuna/${now:%Y-%m-%d_%H-%M-%S}"
