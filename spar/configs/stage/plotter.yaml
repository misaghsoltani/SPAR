# @package _global_
# Plotter stage. This is an alias for the `mse_plotter` stage: both run the
# MSE plotter utility (`run_mse_plotter`), so both use the MSE plotter schema
# and config group.

defaults:
  - /schema/mse_plotter_schema@_here_
  - /plotter: mse_plotter
  - /wandb: default
  - _self_

stage: plotter

# W&B configuration for plotter
wandb:
  job_type: plotter
  name: plotter-${now:%Y-%m-%d_%H-%M-%S}
