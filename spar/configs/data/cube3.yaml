    cube_sticker_imperfections:
      jitter: ${range:0.0,0.05} # Minimal imperfections for competition cubes
    cube_color_calibration:
      r_scale: ${range:0.9,1.1}
      g_scale: ${range:0.9,1.1}
      b_scale: ${range:0.9,1.1}
    # Indoor lighting conditions
    ambient_light:
      alpha: ${range:0.3,0.6}
      color: "#ffe5cc" # Warm indoor lighting
    color_temperature:
      shift: ${range:0.05,0.25} # Slight warm bias
    camera_variation:
