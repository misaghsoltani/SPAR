    gaussian_noise:
      noise_level: ${range:0.01,0.02}

  # Surveillance/security camera cube detection
  noisy_camera:
    enabled: true
    # Security camera characteristics
    gaussian_noise:
      noise_level: ${range:0.06,0.12}
    salt_pepper_noise:
      amount: ${range:0.008,0.03}
      salt_vs_pepper: ${range:0.4,0.6}
    color_banding:
      levels: ${choice:[16,20,24]}
    contrast_brightness:
      contrast: ${range:0.8,1.1}
      brightness: ${range:-0.1,0.05}
    edge_cropping:
