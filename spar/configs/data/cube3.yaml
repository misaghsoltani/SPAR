# @package data
# Cube3-specific data configuration

defaults:
  - /data: default
  - _self_

# Default dataset configurations that can be used in experiment configs
datasets:
  - name: train
    num_eps: 10
    num_steps: 10
    batch_size_per_worker: 0 # Auto-calculate based on num_cpus
    file_name: "${env.name}_${.name}_${.num_eps}eps_${.num_steps}steps"
    use_variations: true
    variations_first_state_only: false
    num_cpus: 10
    compression: true

  - name: val
    num_eps: 8
    num_steps: 8
    batch_size_per_worker: 0 # Auto-calculate based on num_cpus
    file_name: "${env.name}_${.name}_${.num_eps}eps_${.num_steps}steps"
    use_variations: false
    variations_first_state_only: false
    num_cpus: 10
    compression: true

  - name: test
    num_eps: 6
    num_steps: 6
    batch_size_per_worker: 0 # Auto-calculate based on num_cpus
    file_name: "${env.name}_${.name}_${.num_eps}eps_${.num_steps}steps"
    use_variations: true
    variations_first_state_only: true
    num_cpus: 10
    compression: true

