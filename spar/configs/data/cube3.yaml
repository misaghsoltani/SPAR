    cube_sticker_imperfections:
      jitter: ${range:0.0,0.02} # Minimal imperfections
    # Camera settings
    # camera_preset:
    #   preset: ${choice:[default,corner,side]}
    camera_variation:
      yaw: ${range:-10,10}
      pitch: ${range:-10,10}
      roll: ${range:-10,10}
    # Output image settings
    gaussian_noise:
      noise_level: ${range:0.01,0.01}
    contrast_brightness:
      contrast: ${range:1.1,1.3}
      brightness: ${range:0.02,0.1}

  camera_image_background:
    enabled: true
    camera_variation:
      yaw: ${range:-20,20}
      pitch: ${range:-10,10}
      roll: ${range:-20,20}
    background_image:
      enabled: true
      alpha: ${range:0.3,0.9}
      resize_mode: ${choice:[fill,contain,cover,center]}
    zoom_effect:
      enabled: true
      factor: ${range:1.0,1.3}
      interpolation: 1 # cv2.INTER_LINEAR
      border_mode: 4 # cv2.BORDER_REFLECT_101
