  # Outdoor cube solving
  outdoor_lighting:
    enabled: true
    # Natural lighting variation
    directional_light:
      gamma: ${range:0.3,3.0}
      angle: ${range:0,360}
      intensity: ${range:0.1,5.0}
      ambient: ${range:0.0,1.0}
      apply_vignette: true
      vignette_strength: ${range:0.0,1.0}
    color_temperature:
      shift: ${range:-0.2,0.2}
    # Weather effects
    gaussian_blur:
      sigma: ${range:0.3,1.2} # Atmospheric effects
    exposure_variation:
      gamma: ${range:0.8,1.2}
    # Cube effects in outdoor conditions
    cube_color_calibration:
      r_scale: ${range:0.95,1.05}
      g_scale: ${range:0.95,1.05}
      b_scale: ${range:0.95,1.05}
    camera_variation:
      yaw: ${range:-15,15}
      pitch: ${range:-15,15}
      roll: ${range:-10,10}
    background_randomization:
      enabled: true
    gaussian_noise:
      noise_level: ${range:0.02,0.08}

  # Cube bright setup
  bright_lighting:
    enabled: true
    # Clean, well-lit appearance for tutorials
    ambient_light:
      alpha: ${range:0.4,0.6}
      color: "#ffffff" # Bright white lighting
    contrast_brightness:
      contrast: ${range:1.0,1.2}
      brightness: ${range:0.0,0.15}
    # Cube colors selected to keep adjacent stickers distinct
    cube_material_finish:
      finish: "glossy"
    cube_color_calibration:
