# @package search_data

# Default configuration for search pair data generation
save_dir: spar/offline_data/search_pairs

datasets:
  - name: default_pairs
    num_pairs: 100
    reverse_goal: false
    goal_num_steps: null
    goal_seeds: null
    start_seed: null
    num_seeds: null
    apply_variations_to: both # none | start | goal | both
    file_name: "${env.name}_${.name}_${.num_pairs}pairs"
    save_dir: null
    compression: none

effects:
  camera_and_image:
    enabled: true
    cube_directional_lighting:
      ambient_intensity: ${range:0.1,0.7}
      shadow_intensity: ${range:0.05,0.7}
      gradient_strength: ${range:0.1,2.5}
      subsurface_scattering: ${range:0.01,0.2}
      azdeg: ${range:0.0,345.0}
      altdeg: ${range:0.0,90.0}
    background_image:
      alpha: ${range:0.3,1.0}
      resize_mode: ${choice:[fill]} #fill,contain,cover,center]}
    camera_variation:
      yaw: ${range:-15,15}
      pitch: ${range:-12,12}
      roll: ${range:-15,15}

  # background_texture:
  #   enabled: true
  #   texture_type: ${choice:[grid,dots,stripes,noise,crosshatch,waves]}
  #   color: ${choice:[gray, red, blue, green, yellow, black, white, orange, purple]}
  #   density: ${range:0.1,0.7}
  #   alpha: ${range:0.3,1.0}

  color_variations:
    enabled: true
    cube_directional_lighting:
      ambient_intensity: ${range:0.1,0.7}
      shadow_intensity: ${range:0.05,0.7}
      gradient_strength: ${range:0.1,2.5}
      subsurface_scattering: ${range:0.01,0.2}
      azdeg: ${range:0.0,345.0}
      altdeg: ${range:0.0,90.0}
    camera_variation:
      yaw: ${range:-15,15}
      pitch: ${range:-12,12}
      roll: ${range:-15,15}
    background_image:
      alpha: ${range:0.3,0.9}
      resize_mode: ${choice:[fill,contain,cover,center]}
    cube_zoom:
      zoom_factor: ${range:0.85,1.03}
      offset_x: ${range:-0.12,0.12}
      offset_y: ${range:-0.12,0.12}
    hsv_shift:
      hue_shift: ${range:-0.01,0.01}
      sat_scale: ${range:0.95,1.05}
      val_scale: ${range:0.95,1.05}
    cube_color_shift:
      r: ${range:-0.08,0.08}
      g: ${range:-0.08,0.08}
      b: ${range:-0.08,0.08}
    contrast_brightness:
      contrast: ${range:0.3,1.2}
      brightness: ${range:-0.2,0.2}

  minimal:
    enabled: true
    cube_directional_lighting:
