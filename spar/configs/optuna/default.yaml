# @package optuna

study:
  study_name: ${env.name}_optuna
  n_trials: 10
  timeout_sec: null
  n_jobs: 1
  seed: null
  load_if_exists: true
  gc_after_trial: false
  show_progress_bar: false
  catch_exceptions: true
  recoverable_error_action: fail
  objective: null
  objectives: []
  constraints: []
  base_overrides: []
  workflow: []

storage:
  kind: journal
  path: null
  url: null
  heartbeat_interval: null
  grace_period: null
  engine_kwargs: {}

sampler:
  kind: tpe
  seed: null
  n_startup_trials: 10
  multivariate: false
  group: false
  constant_liar: false

pruner:
  kind: median
  n_startup_trials: 5
  n_warmup_steps: 0
  interval_steps: 1
  n_min_trials: 1
  percentile: 50.0
  min_resource: 1
  reduction_factor: 4

runtime:
  output_root: outputs/optuna
  trial_dir_template: "{output_root}/{study_name}/trial_{trial_number:05d}"
  device_policy: preserve
  device: null
  disable_wandb: true
  copy_resolved_configs: true
  fail_on_missing_artifacts: true
  prune_on_invalid_config: true
  abort_on_unexpected_errors: true

analysis:
  top_k: 5
  export_csv: true
  compute_param_importances: true
  include_failed_trials: true
  output_dir: null

replay:
  top_k: 3
  trial_numbers: []
  overrides: []
  enable_wandb: false
  output_dir: null

parameters: []
scan_paths: []
import_sweep_parameters: false
sweep_parameters: {}
