# @package _global_
# Leave-One-Out Cross-Validation Training for Alignment Model
# This sweep configuration trains alignment models with leave-one-out validation
# After training, run corresponding test sweep with: +experiment=ENV_NAME/leave_one_out_test
# Usage: spar +experiment=ENV_NAME/leave_one_out_train

defaults:
  - override /env: ${env}
  - override /stage: train_alignment_disc
  - override /hydra/sweeper: basic
  - _self_

stage: train_alignment_model
alignment_model_type: discrete
end_to_end: false
freeze_pretrained_models: true
precompute_targets: true

# Hydra sweep configuration for leave-one-out training
hydra:
  mode: MULTIRUN
  sweeper:
    params:
      train.dataloader.variations_to_ignore: choice(
        [background_color_shift],
        [background_image],
        [background_texture],
        [background_randomization],
        [cube_color_calibration],
        [cube_sticker_wear],
        [cube_material_finish],
        [cube_sticker_imperfections],
        [ambient_light],
        [directional_light],
        [color_temperature],
        [hsv_shift],
        [contrast_brightness],
        [exposure_variation],
        [rotate_image],
        [perspective_transform],
        [zoom_effect],
        [spatial_perturbation],
        [adversarial_noise],
        [barrel_distortion],
        [gaussian_noise],
        [salt_pepper_noise],
        [poisson_noise],
        [speckle_noise],
        [color_banding],
        [motion_blur],
        [defocus_blur],
        [radial_blur],
        [occluders],
        [edge_cropping],
        [fog_haze],
        [rain_effect],
        [sensor_inaccuracy],
        [camera_variation]
        )

  job:
    name: ${env}_loo_train_${train.dataloader.variations_to_ignore[0]}
    chdir: false
  run:
    dir: ${save_dir}/experiments/${env}/leave_one_out_validation/train/hold_out_${train.dataloader.variations_to_ignore[0]}
  sweep:
    dir: ${save_dir}/experiments/${env}/leave_one_out_validation/train
    subdir: hold_out_${train.dataloader.variations_to_ignore[0]} # ${hydra.job.num}

# Data paths
data_paths:
  train_data: /<absolute path to project root>/DeepCubeAI_Modified/spar/data/offline_data/${env}/variations/var_train_3000eps_30steps.h5
  val_data: /<absolute path to project root>/DeepCubeAI_Modified/spar/data/offline_data/${env}/variations/var_val_1000eps_30steps.h5
  test_data: /<absolute path to project root>/DeepCubeAI_Modified/spar/data/offline_data/${env}/variations/var_test_100eps_10000steps.h5

# Save paths for trained models
save_paths:
  model_dir: spar/saved_models/alignment_models/${env}_alignment_model_disc_loo_${train.dataloader.variations_to_ignore[0]}

# Pretrained model paths
pretrained_model_paths:
  encoder_path: spar/saved_models/world_models/${env}_world_model_disc/world_model_checkpoint_encoder.pt
  transition_model_path: spar/saved_models/world_models/${env}_world_model_disc/world_model_checkpoint_transition.pt
  decoder_path: spar/saved_models/world_models/${env}_world_model_disc/world_model_checkpoint_decoder.pt

# Training configuration - exclude the holdout variation
train:
  dataloader:
    batch_size: 100
    # enable_memory_optimization: false
    # Train on all variations except the holdout one
    variations_to_use: null # Use all except ignored

# W&B configuration
wandb:
  mode: offline
  job_type: train
  group: ${env}_leave_one_out_train
  tags:
    - leave_one_out
    - ${env}
    - alignment_model
    - discrete
    - train
    - holdout_${train.dataloader.variations_to_ignore[0]}
  name: loo_train_holdout_${train.dataloader.variations_to_ignore[0]}
