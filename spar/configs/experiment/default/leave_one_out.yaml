# @package _global_
# Leave-One-Out Cross-Validation Training for Alignment Model
# This sweep configuration trains alignment models with leave-one-out validation
# After training, run corresponding test sweep with: +experiment=ENV_NAME/leave_one_out_test
# Usage: spar +experiment=ENV_NAME/leave_one_out_train

defaults:
  - override /env: ${env}
  - override /hydra/sweeper: basic
  - _self_

# Hydra sweep configuration for leave-one-out training
hydra:
  mode: MULTIRUN
  sweeper:
    params:
      +train.dataloader.variations_to_ignore: &variations choice([background_color_shift],[background_image],[background_texture],[background_randomization],[cube_color_calibration],[cube_sticker_wear],[cube_material_finish],[cube_sticker_imperfections],[ambient_light],[directional_light],[color_temperature],[hsv_shift],[contrast_brightness],[exposure_variation],[rotate_image],[perspective_transform],[zoom_effect],[spatial_perturbation],[adversarial_noise],[barrel_distortion],[gaussian_noise],[salt_pepper_noise],[poisson_noise],[speckle_noise],[color_banding],[motion_blur],[defocus_blur],[radial_blur],[occluders],[edge_cropping],[fog_haze],[rain_effect],[sensor_inaccuracy],[camera_variation])
      +test.dataloader.variations_to_use: *variations
      experiment: choice(${env.name}/leave_one_out_train,${env.name}/leave_one_out_test)
      # +wandb:
      #   mode: offline
# W&B configuration

# spar +experiment=${env.name}/leave_one_out_train dataloader.variations_to_ignore=[background_color_shift]
# spar +experiment=${env.name}/leave_one_out_test dataloader.variations_to_use=[background_color_shift]
