# @package _global_
# DigitJump-specific configuration for training discrete environment model

defaults:
  - override /env: digitjump
  - override /stage: train_env_disc
  - _self_

stage: train_world_model
world_model_type: discrete
end_to_end: false

data_paths:
  train_data: spar/offline_data/${env.name}/train_9000eps_30steps_no_vars.h5
  val_data: spar/offline_data/${env.name}/val_1000eps_30steps_no_vars.h5
  test_data: spar/offline_data/${env.name}/test_10eps_10000steps_no_vars.h5

save_paths:
  model_dir: spar/saved_models/world_models/${env.name}_world_model_disc

train:
  device: cuda
  test_steps: 30
  print_interval: 100
  eval_interval: 100
  checkpoint_interval: 100
  batch_size: 100
  optimizer: adam

  dataloader:
    batch_size: 100
    num_batches_per_epoch: null
    replacement: true
    transform: null
    dtype: float32
    num_workers: 0
    pin_memory: false
    persistent_workers: false
    pin_memory_device: ""
    infinite: true
    base_only: true
    variations_to_use: null
    variations_to_ignore: null

  compile:
    fullgraph: false
    dynamic: null
    backend: "inductor"
    mode: null
    options: null
    disable: true

  scheduler:
    type: ExponentialLR
    params:
      gamma: 0.9999993

  phases:
    - max_itrs: 40000
      lr: 0.001
      env_coeff: 0.0001
    - max_itrs: 60000
      lr: 0.001
      env_coeff: 0.001
    - max_itrs: 80000
      lr: 0.001
      env_coeff: 0.01
    - max_itrs: 100000
      lr: 0.001
      env_coeff: 0.1
    - max_itrs: 120000
      lr: 0.001
      env_coeff: 0.5
    - max_itrs: 140000
      lr: 0.0001
      env_coeff: 0.5
    - max_itrs: 160000
      lr: 0.00001
      env_coeff: 0.5
    - max_itrs: 180000
      lr: 0.000001
      env_coeff: 0.5

hydra:
  run:
    dir: outputs/experiments/${env.name}/train_world_model_disc/${now:%Y-%m-%d_%H-%M-%S}
