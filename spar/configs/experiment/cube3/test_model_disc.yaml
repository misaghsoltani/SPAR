# @package _global_
# Configuration for discrete model testing stage

defaults:
  - override /env: cube3
  - override /stage: test_model_disc
  - _self_

stage: test_model
test_model_type: discrete

test:
  end_to_end: false
  use_alignment_model: true
  precompute_targets: true
  log_interval: 1000
  save_interval: 2000
  visualization_format: png
  visualization_episode_index: 0
  visualization_steps: null #[1, 100] # Visualize steps in addition to every 1000th step
  top_k: 1
  apply_diff_highlighting: false

  dataloader:
    batch_size: 100
    enable_memory_optimization: false
    use_variation_for_all_states: false
    variations_to_use: null #["camera_variation"]
    variations_to_ignore: null
    use_encoded_targets: true

  compile:
    fullgraph: true
    dynamic: false
    backend: inductor
    mode: max-autotune
    options: null
    disable: true

data_paths:
  test_data: spar/offline_data/cube3/sim2real/test_100eps_10000steps_with_vars.h5
  # test_data: spar/offline_data/cube3/val_500eps_30steps_with_vars.h5

save_paths:
  images_dir: ${hydra:runtime.output_dir}/model_tests/images/discrete
  plots_dir: ${hydra:runtime.output_dir}/model_tests/plots/discrete
  metrics_dir: ${hydra:runtime.output_dir}/model_tests/metrics/discrete

pretrained_model_paths:
  encoder_path: spar/saved_models/world_models/${env.name}_world_model_disc/world_model_checkpoint_encoder.pt
  transition_model_path: spar/saved_models/world_models/${env.name}_world_model_disc/world_model_checkpoint_transition_model.pt
  decoder_path: spar/saved_models/world_models/${env.name}_world_model_disc/world_model_checkpoint_decoder.pt
  alignment_model_path: spar/saved_models/alignment_models/cube3_alignment_model_disc_sim2real_${now:%Y-%m-%d}/alignment_model_checkpoint_alignment_model.pt

