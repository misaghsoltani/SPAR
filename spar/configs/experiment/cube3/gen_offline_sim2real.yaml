# @package _global_
# Cube3-specific configuration for generating offline data

defaults:
  - default/gen_offline
  - override /env: cube3
  - override /data: null
  - _self_

data:
  num_cpus: 110
  compression: false
  use_variations: true
  batch_size_per_worker: 100 # use 0 for auto-calculate
  variation_sharing_group_size: 1
  save_dir: "spar/offline_data/cube3/sim2real"

  datasets:
    - name: train_with_vars
      num_eps: 9000
      num_steps: 30
      start_seed: null
      num_seeds: null
      use_variations: true
      variations_first_state_only: false
      file_name: "train_${.num_eps}eps_${.num_steps}steps_with_vars"
      batch_size_per_worker: 100 # use 0 for auto-calculate
      variation_sharing_group_size: 1

    - name: val_with_vars
      num_eps: 1000
      num_steps: 30
      start_seed: null
      num_seeds: null
      use_variations: true
      variations_first_state_only: false
      file_name: "val_${.num_eps}eps_${.num_steps}steps_with_vars"
      batch_size_per_worker: 100 # use 0 for auto-calculate
      variation_sharing_group_size: 1

    - name: test_with_vars
      num_eps: 100
      num_steps: 10000
      start_seed: null
      num_seeds: null
      use_variations: true
      variations_first_state_only: true
      file_name: "test_${.num_eps}eps_${.num_steps}steps_with_vars"
      batch_size_per_worker: 100 # use 0 for auto-calculate
      variation_sharing_group_size: 1

  effects:
    camera_and_image:
      enabled: true
      cube_texture_scratches:
        noise_level: ${range:0.0001,0.03}
      reflections:
        enabled: false
        intensity: ${range:0.05,0.3}
        num_reflections: ${irange:1,3}
        size_min: ${range:0.05,0.09}
        size_max: ${range:0.12,0.22}
        sharpness: ${range:0.4,0.8}
        elongation: ${range:1.2,2.2}
        angle: ${range:0,360}
        color_temperature: ${range:0.3,0.7}
        surface_gloss: ${range:0.3,0.7}
        chromatic: ${range:0.05,0.2}
        source_threshold: ${range:0.72,0.9}
        source_x: -1.0
        source_y: -1.0
        reflection_x: -1.0
        reflection_y: -1.0
        position_spread: ${range:0.1,0.25}
      lens_glare:
        enabled: false
        intensity: ${range:0.05,0.25}
        threshold: ${range:0.72,0.9}
        bloom_strength: ${range:0.2,0.5}
        bloom_radius: ${range:0.03,0.08}
        halo_strength: ${range:0.1,0.35}
        halo_radius: ${range:0.2,0.5}
        ghost_strength: ${range:0.05,0.2}
        num_ghosts: ${irange:1,3}
        streak_strength: ${range:0.05,0.2}
        streak_length: ${range:0.5,1.0}
        streak_width: ${range:0.03,0.05}
        angle: ${range:0,360}
        source_x: -1.0
        source_y: -1.0
        chromatic: ${range:0.05,0.2}
        glare_size: ${range:0.7,1.3}
      resize_degradation:
        strength: ${range:0.0015,0.45}
        resize_scale: ${range:0.5,0.85}
        target_height: 0
        target_width: 0
        interpolation: lanczos
        save_format: jpeg
        jpeg_quality: 85
        jpeg_subsampling: ${irange:1,5}
        png_compress_level: 6
        roundtrips: ${irange:1,2}
      cube_zoom:
        zoom_factor: ${range:0.85,1.05}
        offset_x: ${range:-0.2,0.2}
        offset_y: ${range:-0.2,0.2}
      cube_directional_lighting:
