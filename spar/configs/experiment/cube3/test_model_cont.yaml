# @package _global_
# Configuration for continuous model testing stage

defaults:
  - override /env: cube3
  - override /stage: test_model_cont
  - _self_

stage: test_model
test_model_type: continuous

test:
  end_to_end: true
  use_alignment_model: true
  precompute_targets: false
  log_interval: 1000
  save_interval: 1000
  visualization_format: png
  visualization_episode_index: 0
  visualization_steps: null #[1, 100] # Visualize steps in addition to every 1000th step
  top_k: 1
  apply_diff_highlighting: false

  dataloader:
    batch_size: 100
    enable_memory_optimization: false
    use_variation_for_all_states: false
    variations_to_use: null #["base"]
    variations_to_ignore: null
    use_encoded_targets: false

  compile:
    fullgraph: true
    dynamic: false
    backend: inductor
    mode: max-autotune
    options: null
    disable: true

data_paths:
  test_data: spar/offline_data/cube3/sim2real/test_100eps_10000steps_with_vars.h5
  # test_data: spar/offline_data/cube3/val_500eps_30steps_with_vars.h5

save_paths:
  images_dir: ${hydra:runtime.output_dir}/model_tests/images/continuous
  plots_dir: ${hydra:runtime.output_dir}/model_tests/plots/continuous
  metrics_dir: ${hydra:runtime.output_dir}/model_tests/metrics/continuous

pretrained_model_paths:
  encoder_path: null #spar/saved_models/alignment_models/${env.name}_alignment_model_cont_sim2real/alignment_model_checkpoint_encoder.pt
  transition_model_path: spar/saved_models/alignment_models/${env.name}_alignment_model_cont_sim2real/alignment_model_checkpoint_transition_model.pt
  decoder_path: spar/saved_models/alignment_models/${env.name}_alignment_model_cont_sim2real/alignment_model_checkpoint_decoder.pt
  alignment_model_path: spar/saved_models/alignment_models/${env.name}_alignment_model_cont_sim2real/alignment_model_checkpoint_alignment_model.pt
# spar/saved_models/alignment_models/cube3_alignment_model_cont_sim2real
model:
  discrete: null
  dqn: null

wandb:
  mode: disabled # 'online', 'offline', or 'disabled'
  job_type: test

hydra:
  run:
    dir: outputs/experiments/cube3/test_model_cont/${now:%Y-%m-%d_%H-%M-%S}
