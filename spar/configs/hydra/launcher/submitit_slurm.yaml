# @package hydra.launcher
# This file configures the Submitit launcher for Slurm execution.

_target_: hydra_plugins.hydra_submitit_launcher.submitit_launcher.SlurmLauncher
# Directory where submitit stores job metadata and logs (%j is replaced with job ID)
submitit_folder: ${hydra.sweep.dir}/.submitit/%j

# ===== BASE QUEUE CONFIGURATION =====
# Configuration shared by all executors

# Maximum time for the job in minutes
timeout_min: 0
# Number of CPUs to use for each task
cpus_per_task: null
# Number of GPUs to use on each node
gpus_per_node: null
# Number of tasks to spawn on each node
tasks_per_node: 1
# Memory to reserve for the job on each node (in GB)
mem_gb: null
# Number of nodes to use for the job
nodes: 1
# Name of the job
name: ${hydra.job.name}
# Redirect stderr to stdout
stderr_to_stdout: false

# ===== SLURM-SPECIFIC PARAMETERS =====
# These parameters are used to configure sbatch
# For more info check: https://github.com/facebookincubator/submitit/blob/main/submitit/slurm/slurm.py
# More information: https://slurm.schedmd.com/sbatch.html

# Slurm partition to use on the cluster
partition: null
# Quality of Service (QoS) to use for the job
qos: null
# Comment to add to the job
comment: null
# Node features or constraints to require
constraint: null
# Nodes to exclude from the job
exclude: null
# Generic resources (e.g., "gpu:2" for 2 GPUs)
gres: null
# Number of CPUs per GPU
cpus_per_gpu: null
# Number of GPUs per task
gpus_per_task: null
# Memory per GPU (e.g., "8G")
mem_per_gpu: null
# Memory per CPU (e.g., "4G")
mem_per_cpu: null
# Account to charge for the job
account: null

# USR1 signal delay before timeout (in seconds)
signal_delay_s: 120
# Maximum number of retries on job timeout
# Change this only after the job supports resubmission from a stored checkpoint.
# by resuming from the latest stored checkpoint.
# Check: https://github.com/facebookincubator/submitit/blob/main/docs/checkpointing.md
max_num_timeout: 0
# Additional parameters not currently available in the plugin
# Example: {"mail-user": "user@example.com", "mail-type": "BEGIN"}
additional_parameters: {}
# Maximum number of jobs running in parallel
array_parallelism: 256
# A list of commands to run in sbatch before running srun
setup: null
# Additional arguments that should be passed to srun
srun_args: null
