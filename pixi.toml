[workspace]
platforms = [
    "osx-arm64",
    "osx-64",
    "linux-64",
    "linux-aarch64",
    "win-64",
    { name = "linux-64-cuda12", platform = "linux-64", cuda = "12.0" },
    { name = "linux-aarch64-cuda12", platform = "linux-aarch64", cuda = "12.0" },
    { name = "win-64-cuda12", platform = "win-64", cuda = "12.0" },
    { name = "linux-64-cuda13", platform = "linux-64", cuda = "13.0" },
    { name = "linux-aarch64-cuda13", platform = "linux-aarch64", cuda = "13.0" },
    { name = "win-64-cuda13", platform = "win-64", cuda = "13.0" },
    # { name = "linux-64-glibc217", platform = "linux-64", glibc = "2.17" },
    # { name = "linux-aarch64-glibc217", platform = "linux-aarch64", glibc = "2.17" },
    # { name = "win-64-glibc217", platform = "win-64", glibc = "2.17" },
    # { name = "linux-64-cuda12-glibc217", platform = "linux-64", cuda = "12.0", glibc = "2.17" },
    # { name = "linux-aarch64-cuda12-glibc217", platform = "linux-aarch64", cuda = "12.0", glibc = "2.17" },
    # { name = "win-64-cuda12-glibc217", platform = "win-64", cuda = "12.0", glibc = "2.17" },
]
name = "spar"
description = "Stable Planning through Aligned Representations (SPAR) in Model-Based Reinforcement Learning"
readme = "README.md"
authors = ["Misagh Soltani <msoltani@email.sc.edu>"]
license = "MIT"
license-file = "LICENSE"
channels = ["conda-forge"]
preview = ["pixi-build"]


[tasks]
spar = "spar"
check-ci = "python -c 'import spar; import spar.optuna; import spar.pipeline' && spar --help >/dev/null"
ci = "pixi run -e ci check-ci && pixi run -e ci test-ci && pixi run -e build buildpy-clean"

[package]
name = "spar"
version = "0.1.0"


[package.build]
backend = { name = "pixi-build-python", version = "*", channels = [
    "https://prefix.dev/pixi-build-backends",
    "https://prefix.dev/conda-forge",
] }
config = { debug-dir = ".build-debug", extra-input-globs = [
    "*.md",
    "spar/environments/sokoban_data/**",
    "spar/environments/puzzlegen/data/**",
    "spar/**",
    "spar/py.typed",
    "README.md",
], exclude = [
    "*.py[cod]",
    "__pycache__/**",
    ".DS_Store",
    ".vscode",
    ".git",
    ".pixi",
    "**/.cache/**",
    "**/.parcel-cache/**",
    "**/.vite/**",
    "**/node_modules/**",
    "spar/offline_data/**",
    "spar/saved_models/**",
    "spar/**/*.ckpt",
    "spar/**/*.h5",
    "spar/**/*.hdf5",
    "spar/**/*.npy",
    "spar/**/*.npz",
    "spar/**/*.pkl",
    "spar/**/*.pt",
    "spar/**/*.pth",
    "spar/search_test/*.jpeg",
    "spar/search_test/*.jpg",
    "spar/search_test/*.png",
    "spar/search_test/res/**",
    "spar/search_test/results/**",
] }

[package.host-dependencies]
hatchling = "*"
uv = "*"

[package.build-dependencies]
python = ">=3.10, <3.15"

[environments]
default = { solve-group = "default", platforms = [
    "osx-arm64",
    "osx-64",
    "linux-64",
    "linux-aarch64",
    "win-64",
    "linux-64-cuda12",
    "linux-aarch64-cuda12",
    "win-64-cuda12",
    "linux-64-cuda13",
    "linux-aarch64-cuda13",
    "win-64-cuda13",
] }
dev = { features = [
    "dev",
    "datadashboard",
    "wandblocalserver",
    "test",
    "doc",
    "cuda",
    # "build",
], solve-group = "default" }
doc = { features = ["doc"] }
test = { features = ["test"], solve-group = "default" }
ci = { features = ["test"], solve-group = "default" }
build = { features = ["build"], solve-group = "default" }
datadashboard = { features = ["datadashboard"], solve-group = "default" }
wandblocalserver = { features = ["wandblocalserver"], solve-group = "default" }
cuda = { features = ["cuda"], solve-group = "default" }
all = { features = [
    "test",
    "dev",
    "cuda",
    # "build",
    "datadashboard",
    "wandblocalserver",
    "doc",
], solve-group = "default" }
# glibc217 = { features = [
#     "glibc217",
# ], no-default-feature = true, platforms = [
#     "linux-64-glibc217",
#     "linux-aarch64-glibc217",
#     "win-64-glibc217",
# ] }

