[feature.dev.tasks]
lint = "ruff check --fix"
ulint = "ruff check --fix --unsafe-fixes"
format = "ruff format"
fix = "ruff check --fix --unsafe-fixes; ruff format"
format-check = "ruff format --check"
pyright = "pyright"
mypy = "mypy spar"
typecheck = "pyright && mypy spar"
yamllint = "yamllint ."
shellcheck = "[ -d scripts ] && find scripts -type f -name '*.sh' -exec shellcheck {} + || true"
check = "ruff check && ruff format --check && pyright && mypy spar && yamllint . && (test ! -d scripts || ! find scripts -type f -name '*.sh' | grep -q . || find scripts -type f -name '*.sh' | xargs shellcheck)"

[feature.dev.tasks.fmt]
args = [
    { "arg" = "dir", "default" = "spar" },
    { "arg" = "config_file", "default" = "mypy.ini" },
]
cmd = "ruff check --fix --unsafe-fixes {{ dir }}; ruff format {{ dir }}; mypy {{ dir }} --config-file={{ config_file }} --cache-fine-grained; pyright {{ dir }}"

[feature.datadashboard.dependencies]
nodejs = "*"
pnpm = "*"
sqlite = "*"


[feature.datadashboard.pypi-dependencies]
spar = { path = ".", editable = true }
spar-datadash = { path = "datadash", editable = true }
rich = "*"
flask = "*"

[feature.datadashboard.tasks]
spar-datadash = "python -m spar_datadash.react_cli"
spar-datadash-react = "bash scripts/run_datadash_react.sh"
spar-datadash-react-install = "cd datadash/spar-datadash-react && pnpm install --frozen-lockfile"
spar-datadash-react-build = "cd datadash/spar-datadash-react && pnpm install --frozen-lockfile && pnpm build"
spar-datadash-clean = "python scripts/clean_datadash.py"


[feature.test.pypi-dependencies]
pytest = "*"
nose2 = "*"
pytest-cov = "*"
tox = "*"
pytest-mock = "*"

[feature.test.tasks]
test = "pytest"
test_webapp = "pytest tests/test_dashboard.py --maxfail=3 -v"
test-coverage = "pytest --cov=spar --cov-report=term-missing --cov-report=xml:coverage.xml"
test-ci = "pytest -q tests/test_hydra_help_patch.py tests/test_digit_jump.py tests/test_optuna_grid_sampler.py"
test-performance = "pytest tests/test_iceslider_performance.py -o addopts='' -q"
test-slowest = "pytest --durations=10 -q"
tox = "tox -q"
nose2 = "nose2 -v"
coverage-html = "pytest --cov=spar --cov-report=html:htmlcov"


[feature.wandblocalserver.pypi-dependencies]
docker = "*"


[feature.wandblocalserver.tasks]
run-wandb = "python -m spar.scripts.run_wandb_offline"


[feature.doc.dependencies]
furo = "*"
sphinx-copybutton = "*"
sphinx-autodoc2 = "*"
sphinx-sitemap = "*"
myst-parser = "*"
linkify-it-py = "*"
sphinx = "*"

[feature.doc.tasks]
docs = "sphinx-build -b html docs docs/_build/html"
docs-nitpick = "sphinx-build -nW --keep-going -b html docs docs/_build/html"
docs-clean = "rm -rf docs/_build docs/apidocs"
docs-serve = "python -m http.server --bind 127.0.0.1 --directory docs/_build/html 8000"
docs-run = "rm -rf docs/_build docs/apidocs && sphinx-build -nW --keep-going -b html docs docs/_build/html && python -m http.server --bind 127.0.0.1 --directory docs/_build/html 8000"


[feature.build.dependencies]
hatch = "*"

[feature.build.tasks]
build = "pixi build -o dist && rm -rf .build-debug dist/linux-64 dist/win-64 dist/osx-64 dist/osx-arm64 dist/linux-aarch64 dist/noarch"
build-clean = "pixi build --clean -o dist && rm -rf .build-debug dist/linux-64 dist/win-64 dist/osx-64 dist/osx-arm64 dist/linux-aarch64 dist/noarch"
buildpy = "hatch build -t wheel -t sdist"
buildpy-clean = "hatch build -t wheel -t sdist --clean"
build-all = "pixi build -o dist && rm -rf .build-debug dist/linux-64 dist/win-64 dist/osx-64 dist/osx-arm64 dist/linux-aarch64 dist/noarch && hatch build -t wheel -t sdist"


